
<section class="contact-section" id="contact">

  <div class="contact-container">

    <!-- ================= LEFT SIDE ================= -->

    <div class="contact-left">

      <div class="contact-heading">

        <span>CONTACT</span>

        <h2>
          Get in
          <strong>Touch.</strong>
        </h2>

      </div>


      <!-- EMAIL -->

      <div class="contact-item">

        <div class="contact-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 5.5h18v13H3z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round">
            </path>

            <path
              d="m4 7 8 6 8-6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">
            </path>
          </svg>
        </div>

        <div class="contact-details">

          <span>Email</span>

          <a href="mailto:aya.hassan.elsayed769@gmail.com">
            aya.hassan.elsayed769@gmail.com
          </a>

        </div>

      </div>


      <!-- LOCATION -->

      <div class="contact-item">

        <div class="contact-icon">

          <svg viewBox="0 0 24 24" aria-hidden="true">

            <path
              d="M20 10.2c0 5.1-8 10.3-8 10.3S4 15.3 4 10.2a8 8 0 1 1 16 0Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round">
            </path>

            <circle
              cx="12"
              cy="10"
              r="2.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8">
            </circle>

          </svg>

        </div>

        <div class="contact-details">

          <span>Location</span>

          <p>Cairo, Egypt</p>

        </div>

      </div>


      <!-- PHONE -->

      <div class="contact-item">

        <div class="contact-icon">

          <svg viewBox="0 0 24 24" aria-hidden="true">

            <path
              d="M6.5 3.8 9 3l2 5-2.2 1.6a15.7 15.7 0 0 0 5.6 5.6L16 13l5 2v2.5c0 1.1-.9 2-2 2C11.8 19.5 4.5 12.2 4.5 5c0-1.1.9-1.2 2-1.2Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round">
            </path>

          </svg>

        </div>

        <div class="contact-details">

          <span>Phone</span>

          <a href="tel:+201020632179">
            +20 1020632179
          </a>

          <a href="tel:+201026641470">
            +20 1026641470
          </a>

        </div>

      </div>

    </div>


    <!-- ================= RIGHT SIDE ================= -->

    <div class="contact-right">

      <div class="form-header">

        <h3>
          Let's work
          <span>together.</span>
        </h3>

      </div>


      <!-- ================= CONTACT FORM ================= -->

      <form (ngSubmit)="sendMessage()">

        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Your Name
          </label>

          <div class="input-box">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <circle
                cx="12"
                cy="8"
                r="3.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8">
              </circle>

              <path
                d="M5.5 20c.7-3.2 2.9-5 6.5-5s5.8 1.8 6.5 5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round">
              </path>

            </svg>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your name"
              [(ngModel)]="name">

          </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Your Email
          </label>

          <div class="input-box">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <rect
                x="3"
                y="5.5"
                width="18"
                height="13"
                rx="1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8">
              </rect>

              <path
                d="m4 7 8 6 8-6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round">
              </path>

            </svg>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              [(ngModel)]="email">

          </div>

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

          <label for="subject">
            Subject
          </label>

          <div class="input-box">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M4 17.5V20h2.5L18.8 7.7a1.8 1.8 0 0 0-2.5-2.5L4 17.5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round">
              </path>

              <path
                d="m14.8 6.7 2.5 2.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round">
              </path>

            </svg>

            <input
              id="subject"
              name="subject"
              type="text"
              placeholder="Project subject"
              [(ngModel)]="subject">

          </div>

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

          <label for="message">
            Your Message
          </label>

          <div class="input-box textarea-box">

            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path
                d="M4 5.5h16v11H8l-4 3v-14Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round">
              </path>

              <path
                d="M8 10h8M8 13h5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round">
              </path>

            </svg>

            <textarea
              id="message"
              name="message"
              placeholder="Tell me about your project..."
              [(ngModel)]="message">
            </textarea>

          </div>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="send-button">

          <span>
            Send Message
          </span>

          <b>
            →
          </b>

        </button>

      </form>

    </div>

  </div>

</section>
